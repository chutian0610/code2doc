# Publish to npm from a pushed version tag: bump, commit, tag, push —
# CI tests and publishes. Auth is OIDC trusted publishing: register
# this workflow as a trusted publisher for the package on npmjs.com
# (package Settings → trusted publishing; owner, repo, publish.yml).
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release for the pushed tag
      id-token: write # OIDC identity for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10.x; trusted publishing needs npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm ci
      - name: tag matches package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $v" >&2
            exit 1
          fi
      - run: npm test
      - run: npm publish --access public
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
